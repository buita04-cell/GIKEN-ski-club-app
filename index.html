
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クラブ専用 ゲレンデ連絡帳</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#e53935">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f7fb;
      color: #293246;
      text-align: center;
    }
    main {
      max-width: 480px;
      margin: 8vh auto;
      padding: 24px;
    }
    h1 { font-size: 26px; }
    p { line-height: 1.8; }
    input {
      box-sizing: border-box;
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }
    button, .app-link {
      box-sizing: border-box;
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: #e53935;
      color: white;
      border: 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #message, #reset-message {
      min-height: 1.5em;
      color: #b71c1c;
    }
    #logout { background: #596579; }
    .sub-button {
      background: #596579;
    }
    [hidden] { display: none !important; }
    select { box-sizing: border-box; display: block; width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #bbb; border-radius: 8px; font-size: 16px; background: white; }
    .checkin-panel { text-align: left; margin: 24px 0; padding: 16px; background: white; border-radius: 12px; }
    .checkin-panel h2 { text-align: center; }
    .checkin-panel label { display: block; font-weight: bold; margin-top: 12px; }
    .checkin-item { padding: 12px 0; border-bottom: 1px solid #ddd; overflow-wrap: anywhere; }
    .checkin-item p { margin: 4px 0; }
    #checkin-message { min-height: 1.5em; }
    .video-panel { text-align: left; margin: 24px 0; padding: 16px; background: white; border-radius: 12px; }
    .video-panel h2 { text-align: center; }
    .video-panel label { display: block; font-weight: bold; margin-top: 12px; }
    .video-item { padding: 14px 0; border-bottom: 1px solid #ddd; overflow-wrap: anywhere; }
    .video-item video { width: 100%; max-height: 340px; margin-top: 8px; background: #111; border-radius: 8px; }
    .video-note { font-size: 13px; color: #596579; }
    #video-message { min-height: 1.5em; overflow-wrap: anywhere; }
    #video-file { padding: 10px; }
  </style>
</head>

<body>
  <main>
    <h1>⛷️ クラブ専用 ゲレンデ連絡帳</h1>
    <p>スキークラブの連絡・チェックイン・動画共有</p>

    <section id="login-area" hidden>
      <h2>会員ログイン</h2>
      <form id="login-form">
        <input id="email" type="email"
               placeholder="メールアドレス"
               autocomplete="username" required>
        <input id="password" type="password"
               placeholder="パスワード"
               autocomplete="current-password" required>
        <button type="submit">ログイン</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section id="reset-area" hidden>
      <h2>パスワード再設定</h2>
      <p>新しいパスワードを入力してください。</p>
      <form id="reset-form">
        <input id="new-password" type="password"
               placeholder="新しいパスワード（12文字以上）"
               autocomplete="new-password"
               minlength="12" required>
        <input id="confirm-password" type="password"
               placeholder="新しいパスワード（確認）"
               autocomplete="new-password"
               minlength="12" required>
        <button id="reset-button" type="submit">
          パスワードを設定する
        </button>
      </form>
      <p id="reset-message" role="status"></p>
    </section>

    <section id="app-area" hidden>
      <p>ログインしました。</p>
      <a class="app-link" href="#checkin-panel">
        ゲレンデ連絡帳を開く（チェックイン・動画共有）
      </a>
      <div class="checkin-panel" id="checkin-panel">
        <h2>📍 ゲレンデなう</h2>
        <form id="checkin-form">
          <label for="member-name">👤 あなたのお名前</label>
          <input id="member-name" type="text" maxlength="40" placeholder="会員名を入力" required>
          <label for="resort-name">🏔️ 今どこにいますか？</label>
          <select id="resort-name" required>
            <option value="">選択してください</option>
            <option>イエティ</option><option>リバウェル井川</option><option>富士天神山</option>
            <option>白馬八方尾根</option><option>野沢温泉</option><option>志賀高原</option>
            <option>その他（県外）</option>
          </select>
          <label for="snow-condition">❄️ 今日の雪質・状況</label>
          <select id="snow-condition" required>
            <option>粉雪・パウダー</option><option>圧雪・良好</option>
            <option>シャバ雪・春雪</option><option>硬め・アイスバーン</option>
          </select>
          <label for="quick-comment">💬 一言メッセージ</label>
          <select id="quick-comment">
            <option value="">指定なし</option>
            <option>最高のパウダー！</option><option>バーンが引き締まって快適！</option>
            <option>午後はアイスバーン注意</option><option>少し混雑しています</option>
            <option>休憩中・ランチなう ☕</option><option>無事下山・帰路につきます 🚗</option>
          </select>
          <button id="checkin-submit" type="submit">🚀 これで投稿する</button>
        </form>
        <p id="checkin-message" role="status" aria-live="polite"></p>
        <h2>📋 最近のチェックイン</h2>
        <button id="refresh-checkins" type="button" class="sub-button">一覧を更新</button>
        <div id="checkin-list" aria-live="polite"></div>
      </div>
      <div class="video-panel">
        <h2>🎥 15秒動画の共有</h2>
        <p class="video-note">会員専用・最大15秒・10MBまで。投稿から7日間表示します。</p>
        <form id="video-form">
          <label for="video-member-name">👤 投稿者のお名前</label>
          <input id="video-member-name" type="text" maxlength="40" placeholder="会員名を入力" required>
          <label for="video-file">📹 動画を選択（MP4 / MOV）</label>
          <input id="video-file" type="file" accept="video/mp4,video/quicktime,.mp4,.mov" required>
          <button id="video-submit" type="submit">🎥 動画を投稿する</button>
        </form>
        <p id="video-message" role="status" aria-live="polite"></p>
        <h2>📺 最近の動画</h2>
        <button id="refresh-videos" type="button" class="sub-button">動画一覧を更新</button>
        <div id="video-list" aria-live="polite"></div>
      </div>
      <button id="logout" type="button">ログアウト</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL =
      "https://oqnmzqulfuedyrkwebsm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Rm2F6WXitHtTJv2nxHFtkw_v2RT7K7u";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const loginArea = document.getElementById("login-area");
    const resetArea = document.getElementById("reset-area");
    const appArea = document.getElementById("app-area");
    const message = document.getElementById("message");
    const resetMessage = document.getElementById("reset-message");

    let recoveryMode = false;
    let recoveryReady = false;

    function showArea(area) {
      loginArea.hidden = area !== "login";
      resetArea.hidden = area !== "reset";
      appArea.hidden = area !== "app";
    }

    function showSession(session) {
      if (recoveryMode) {
        showArea("reset");
      } else {
        showArea(session ? "app" : "login");
        if (session) {
          loadCheckins();
          loadVideos();
        } else {
          document.getElementById("checkin-list").replaceChildren();
          document.getElementById("checkin-message").textContent = "";
          clearVideos();
          document.getElementById("video-message").textContent = "";
        }
      }
    }

    const urlParams = new URLSearchParams(
      window.location.search
    );
    const hashParams = new URLSearchParams(
      window.location.hash.substring(1)
    );

    if (
      hashParams.get("type") === "recovery" ||
      urlParams.get("type") === "recovery" ||
      urlParams.has("token_hash")
    ) {
      recoveryMode = true;
      showArea("reset");
    }

    client.auth.onAuthStateChange(function (event, session) {
      if (event === "PASSWORD_RECOVERY") {
        recoveryMode = true;
        recoveryReady = true;
        showArea("reset");
        resetMessage.textContent = "";
        return;
      }

      if (recoveryMode) {
        showArea("reset");
        return;
      }

      showSession(session);
    });

    async function initialize() {
      const tokenHash = urlParams.get("token_hash");
      const tokenType = urlParams.get("type");

      if (tokenHash && tokenType === "recovery") {
        recoveryMode = true;
        showArea("reset");

        const { error } = await client.auth.verifyOtp({
          token_hash: tokenHash,
          type: "recovery"
        });

        if (error) {
          resetMessage.textContent =
            "再設定リンクが無効か期限切れです。再送信してください。";
          return;
        }

        recoveryReady = true;
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
        return;
      }

      const { data, error } = await client.auth.getSession();

      if (error) {
        if (recoveryMode) {
          resetMessage.textContent =
            "再設定リンクを確認できませんでした。再送信してください。";
        } else {
          showArea("login");
          message.textContent =
            "ログイン状態を確認できませんでした。";
        }
        return;
      }

      if (recoveryMode) {
        if (data.session) {
          recoveryReady = true;
        } else {
          resetMessage.textContent =
            "再設定リンクが無効か期限切れです。再送信してください。";
        }
        showArea("reset");
      } else {
        showSession(data.session);
      }
    }

    document.getElementById("login-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "ログイン確認中...";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent =
            "ログインできません。入力内容をご確認ください。";
          return;
        }

        message.textContent = "";
        showSession(data.session);
      });

    document.getElementById("reset-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!recoveryMode || !recoveryReady) {
          resetMessage.textContent =
            "再設定リンクを確認できません。新しいメールを取得してください。";
          return;
        }

        const password =
          document.getElementById("new-password").value;
        const confirm =
          document.getElementById("confirm-password").value;

        if (password.length < 12) {
          resetMessage.textContent =
            "パスワードは12文字以上にしてください。";
          return;
        }

        if (password !== confirm) {
          resetMessage.textContent =
            "確認用パスワードが一致しません。";
          return;
        }

        const button = document.getElementById("reset-button");
        button.disabled = true;
        resetMessage.textContent = "パスワードを設定中...";

        try {
          const { error } = await client.auth.updateUser({
            password: password
          });

          if (error) {
            resetMessage.textContent =
              "設定できませんでした。リンクの期限などをご確認ください。";
            return;
          }

          const { error: signOutError } =
            await client.auth.signOut();

          if (signOutError) {
            resetMessage.textContent =
              "パスワードは設定されましたが、ログアウトに失敗しました。";
            return;
          }

          recoveryMode = false;
          recoveryReady = false;
          document.getElementById("reset-form").reset();
          document.getElementById("login-form").reset();
          showArea("login");
          message.style.color = "#176b37";
          message.textContent =
            "パスワードを設定しました。新しいパスワードでログインしてください。";
        } finally {
          button.disabled = false;
        }
      });

    document.getElementById("logout")
      .addEventListener("click", async function () {
        const { error } = await client.auth.signOut();

        if (error) {
          alert("ログアウトに失敗しました。");
          return;
        }

        showSession(null);
      });

    async function loadCheckins() {
      const list = document.getElementById("checkin-list");
      list.textContent = "読み込み中...";
      const { data: authData, error: authError } = await client.auth.getUser();
      if (authError || !authData.user) {
        list.textContent = "ログイン状態を確認できません。";
        return;
      }
      const { data, error } = await client.from("checkins")
        .select("id,created_at,member_name,resort_name,condition,comment")
        .order("created_at", { ascending: false })
        .limit(30);
      if (error) {
        list.textContent = "一覧を取得できませんでした。設定・通信状態を確認してください。";
        console.error("checkins select error", error);
        return;
      }
      list.replaceChildren();
      if (!data.length) {
        list.textContent = "まだ投稿がありません。";
        return;
      }
      for (const item of data) {
        const entry = document.createElement("div");
        entry.className = "checkin-item";
        const heading = document.createElement("strong");
        const when = item.created_at ? new Date(item.created_at).toLocaleString("ja-JP") : "";
        heading.textContent = `${item.member_name}（${when}）`;
        const detail = document.createElement("p");
        detail.textContent = `📍 ${item.resort_name} ｜ ❄️ ${item.condition}`;
        entry.append(heading, detail);
        if (item.comment) {
          const comment = document.createElement("p");
          comment.textContent = `💬 ${item.comment}`;
          entry.append(comment);
        }
        list.append(entry);
      }
    }

    document.getElementById("refresh-checkins")
      .addEventListener("click", loadCheckins);

    document.getElementById("checkin-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        const status = document.getElementById("checkin-message");
        const button = document.getElementById("checkin-submit");
        const member_name = document.getElementById("member-name").value.trim();
        const resort_name = document.getElementById("resort-name").value;
        const condition = document.getElementById("snow-condition").value;
        const comment = document.getElementById("quick-comment").value;
        if (!member_name || !resort_name) {
          status.textContent = "お名前とゲレンデを入力してください。";
          return;
        }
        button.disabled = true;
        status.textContent = "投稿中...";
        try {
          const { data: authData, error: authError } = await client.auth.getUser();
          if (authError || !authData.user) {
            status.textContent = "ログインし直してください。";
            return;
          }
          const { error } = await client.from("checkins")
            .insert({ member_name, resort_name, condition, comment: comment || null });
          if (error) {
            console.error("checkins insert error", error);
            status.textContent = "投稿に失敗しました。通信・権限設定をご確認ください。";
            return;
          }
          status.textContent = "投稿を保存しました。";
          await loadCheckins();
        } finally {
          button.disabled = false;
        }
      });


    // Storage内の動画は非公開。ログイン中のみ短期間有効な署名URLで再生する。
    const VIDEO_BUCKET = "ski-videos";
    const VIDEO_MAX_BYTES = 10 * 1024 * 1024;
    const VIDEO_MAX_SECONDS = 15;
    let videoListRequest = 0;

    function clearVideos() {
      videoListRequest++;
      const list = document.getElementById("video-list");
      for (const player of list.querySelectorAll("video")) {
        player.pause();
        player.removeAttribute("src");
        player.load();
      }
      list.replaceChildren();
    }

    function videoFileType(file) {
      const extension = file.name.toLowerCase().split(".").pop();
      if (extension === "mp4" && (!file.type || file.type === "video/mp4")) return "video/mp4";
      if (extension === "mov" && (!file.type || file.type === "video/quicktime")) return "video/quicktime";
      return null;
    }

    function readVideoDuration(file) {
      return new Promise((resolve, reject) => {
        const probe = document.createElement("video");
        const url = URL.createObjectURL(file);
        let settled = false;
        const timeout = setTimeout(() => finish(new Error("動画情報の取得がタイムアウトしました。")), 15000);
        function finish(error, duration) {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          probe.removeAttribute("src");
          probe.load();
          URL.revokeObjectURL(url);
          if (error) reject(error); else resolve(duration);
        }
        probe.preload = "metadata";
        probe.onloadedmetadata = () => {
          if (!Number.isFinite(probe.duration) || probe.duration <= 0) {
            finish(new Error("動画の長さを確認できませんでした。"));
          } else {
            finish(null, probe.duration);
          }
        };
        probe.onerror = () => finish(new Error("この端末では動画を読み取れません。別のMP4動画をお試しください。"));
        probe.src = url;
      });
    }

    async function loadVideos() {
      const list = document.getElementById("video-list");
      clearVideos();
      // clearVideos() は古い読み込みを無効化するため、最新IDを取り直す。
      const currentRequest = videoListRequest;
      list.textContent = "読み込み中...";
      const { data: authData, error: authError } = await client.auth.getUser();
      if (currentRequest !== videoListRequest || appArea.hidden) return;
      if (authError || !authData.user) {
        list.textContent = "ログイン状態を確認できません。";
        return;
      }
      const { data, error } = await client.from("videos")
        .select("id,created_at,member_name,storage_path,expires_at")
        .gt("expires_at", new Date().toISOString())
        .order("created_at", { ascending: false })
        .limit(30);
      if (currentRequest !== videoListRequest || appArea.hidden) return;
      if (error) {
        console.error("videos select error", error);
        list.textContent = "動画一覧を取得できませんでした。";
        return;
      }
      list.replaceChildren();
      if (!data.length) {
        list.textContent = "まだ動画の投稿がありません。";
        return;
      }
      for (const item of data) {
        if (currentRequest !== videoListRequest || appArea.hidden) return;
        const entry = document.createElement("div");
        entry.className = "video-item";
        const title = document.createElement("strong");
        const when = item.created_at ? new Date(item.created_at).toLocaleString("ja-JP") : "";
        title.textContent = `${item.member_name || "会員"}（${when}）`;
        entry.append(title);
        const { data: signed, error: signedError } = await client.storage
          .from(VIDEO_BUCKET).createSignedUrl(item.storage_path, 60 * 30);
        if (currentRequest !== videoListRequest || appArea.hidden) return;
        if (signedError || !signed?.signedUrl) {
          const msg = document.createElement("p");
          msg.textContent = "動画を読み込めませんでした。";
          entry.append(msg);
        } else {
          const player = document.createElement("video");
          player.controls = true;
          player.preload = "none";
          player.playsInline = true;
          player.src = signed.signedUrl;
          entry.append(player);
        }
        list.append(entry);
      }
    }

    document.getElementById("refresh-videos")
      .addEventListener("click", loadVideos);

    document.getElementById("video-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        const status = document.getElementById("video-message");
        const button = document.getElementById("video-submit");
        const file = document.getElementById("video-file").files[0];
        const member_name = document.getElementById("video-member-name").value.trim();
        if (!file || !member_name) {
          status.textContent = "お名前と動画を指定してください。";
          return;
        }
        const contentType = videoFileType(file);
        if (!contentType) {
          status.textContent = "MP4またはMOVファイルを選択してください。";
          return;
        }
        if (file.size > VIDEO_MAX_BYTES || file.size === 0) {
          status.textContent = "動画は10MB以下のファイルを選択してください。";
          return;
        }
        button.disabled = true;
        status.textContent = "動画の長さを確認しています...";
        try {
          const duration = await readVideoDuration(file);
          if (duration > VIDEO_MAX_SECONDS + 0.05) {
            status.textContent = "15秒以内の動画を選択してください。";
            return;
          }
          const { data: authData, error: authError } = await client.auth.getUser();
          if (authError || !authData.user || appArea.hidden) {
            status.textContent = "ログインし直してください。";
            return;
          }
          const user = authData.user;
          const extension = contentType === "video/mp4" ? "mp4" : "mov";
          const path = `${user.id}/${crypto.randomUUID()}.${extension}`;
          status.textContent = "動画をアップロード中...";
          const { error: uploadError } = await client.storage.from(VIDEO_BUCKET)
            .upload(path, file, { contentType, upsert: false });
          if (uploadError) {
            console.error("video upload error", uploadError);
            status.textContent = "アップロードに失敗しました。通信・権限設定をご確認ください。";
            return;
          }
          const { error: insertError } = await client.from("videos")
            .insert({ user_id: user.id, member_name, storage_path: path });
          if (insertError) {
            console.error("videos insert error", insertError);
            // DB登録に失敗した動画がStorageに残らないよう、削除を試みる。
            const { error: cleanupError } = await client.storage
              .from(VIDEO_BUCKET).remove([path]);
            if (cleanupError) {
              console.error("orphan video cleanup error", cleanupError);
              status.textContent = "投稿履歴の登録に失敗し、動画の後片付けもできませんでした。管理者に連絡してください。";
            } else {
              status.textContent = "投稿履歴の登録に失敗しました。動画の転送を取り消しました。もう一度お試しください。";
            }
            return;
          }
          document.getElementById("video-file").value = "";
          status.textContent = "動画を投稿しました。";
          await loadVideos();
        } catch (error) {
          console.error("video validation error", error);
          status.textContent = error.message || "動画を確認できませんでした。";
        } finally {
          button.disabled = false;
        }
      });

    initialize();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./sw.js")
          .then(function (registration) {
            console.log(
              "Service Worker registered:",
              registration.scope
            );
          })
          .catch(function (error) {
            console.error(
              "Service Worker registration failed:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
