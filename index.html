
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クラブ専用 ゲレンデ連絡帳</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#e53935">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f7fb;
      color: #293246;
      text-align: center;
    }
    main {
      max-width: 480px;
      margin: 8vh auto;
      padding: 24px;
    }
    h1 { font-size: 26px; }
    p { line-height: 1.8; }
    input {
      box-sizing: border-box;
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }
    button, .app-link {
      box-sizing: border-box;
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: #e53935;
      color: white;
      border: 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #message, #reset-message {
      min-height: 1.5em;
      color: #b71c1c;
    }
    #logout { background: #596579; }
    .sub-button {
      background: #596579;
    }
    [hidden] { display: none !important; }
    select { box-sizing: border-box; display: block; width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #bbb; border-radius: 8px; font-size: 16px; background: white; }
    .checkin-panel { text-align: left; margin: 24px 0; padding: 16px; background: white; border-radius: 12px; }
    .checkin-panel h2 { text-align: center; }
    .checkin-panel label { display: block; font-weight: bold; margin-top: 12px; }
    .checkin-item { padding: 12px 0; border-bottom: 1px solid #ddd; overflow-wrap: anywhere; }
    .checkin-item p { margin: 4px 0; }
    #checkin-message { min-height: 1.5em; }
    .admin-panel { text-align: left; margin: 24px 0; padding: 16px; background: #fff; border: 2px solid #344968; border-radius: 12px; }
    .admin-panel h2 { text-align: center; }
    .admin-item { padding: 14px 0; border-bottom: 1px solid #ddd; overflow-wrap: anywhere; }
    .admin-item p { margin: 5px 0; }
    .admin-actions { display: flex; gap: 8px; }
    .admin-actions button { flex: 1; margin-top: 10px; padding: 12px 4px; }
    .admin-actions .reject { background: #596579; }
    #admin-message { overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <main>
    <h1>⛷️ クラブ専用 ゲレンデ連絡帳</h1>
    <p>スキークラブの連絡・チェックイン・動画共有</p>

    <section id="login-area" hidden>
      <h2>会員ログイン</h2>
      <form id="login-form">
        <input id="email" type="email"
               placeholder="メールアドレス"
               autocomplete="username" required>
        <input id="password" type="password"
               placeholder="パスワード"
               autocomplete="current-password" required>
        <button type="submit">ログイン</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section id="reset-area" hidden>
      <h2>パスワード再設定</h2>
      <p>新しいパスワードを入力してください。</p>
      <form id="reset-form">
        <input id="new-password" type="password"
               placeholder="新しいパスワード（12文字以上）"
               autocomplete="new-password"
               minlength="12" required>
        <input id="confirm-password" type="password"
               placeholder="新しいパスワード（確認）"
               autocomplete="new-password"
               minlength="12" required>
        <button id="reset-button" type="submit">
          パスワードを設定する
        </button>
      </form>
      <p id="reset-message" role="status"></p>
    </section>

    <section id="app-area" hidden>
      <p>ログインしました。</p>
      <a class="app-link"
         href="https://giken-ski-club.streamlit.app/">
        ゲレンデ連絡帳を開く
      </a>
      <div class="checkin-panel">
        <h2>📍 ゲレンデなう</h2>
        <form id="checkin-form">
          <label for="member-name">👤 あなたのお名前</label>
          <input id="member-name" type="text" maxlength="40" placeholder="会員名を入力" required>
          <label for="resort-name">🏔️ 今どこにいますか？</label>
          <select id="resort-name" required>
            <option value="">選択してください</option>
            <option>イエティ</option><option>リバウェル井川</option><option>富士天神山</option>
            <option>白馬八方尾根</option><option>野沢温泉</option><option>志賀高原</option>
            <option>その他（県外）</option>
          </select>
          <label for="snow-condition">❄️ 今日の雪質・状況</label>
          <select id="snow-condition" required>
            <option>粉雪・パウダー</option><option>圧雪・良好</option>
            <option>シャバ雪・春雪</option><option>硬め・アイスバーン</option>
          </select>
          <label for="quick-comment">💬 一言メッセージ</label>
          <select id="quick-comment">
            <option value="">指定なし</option>
            <option>最高のパウダー！</option><option>バーンが引き締まって快適！</option>
            <option>午後はアイスバーン注意</option><option>少し混雑しています</option>
            <option>休憩中・ランチなう ☕</option><option>無事下山・帰路につきます 🚗</option>
          </select>
          <button id="checkin-submit" type="submit">🚀 これで投稿する</button>
        </form>
        <p id="checkin-message" role="status" aria-live="polite"></p>
        <h2>📋 最近のチェックイン</h2>
        <button id="refresh-checkins" type="button" class="sub-button">一覧を更新</button>
        <div id="checkin-list" aria-live="polite"></div>
      </div>
      <section id="admin-panel" class="admin-panel" hidden>
        <h2>🔐 管理者メニュー</h2>
        <h3>会員登録申請一覧</h3>
        <button id="refresh-requests" class="sub-button" type="button">申請一覧を更新</button>
        <p id="admin-message" role="status" aria-live="polite"></p>
        <div id="membership-request-list" aria-live="polite"></div>
        <p>承認後の招待メール送信は、現時点では管理者が別途行います。</p>
      </section>
      <button id="logout" type="button">ログアウト</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL =
      "https://oqnmzqulfuedyrkwebsm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Rm2F6WXitHtTJv2nxHFtkw_v2RT7K7u";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const loginArea = document.getElementById("login-area");
    const resetArea = document.getElementById("reset-area");
    const appArea = document.getElementById("app-area");
    const message = document.getElementById("message");
    const resetMessage = document.getElementById("reset-message");

    let recoveryMode = false;
    let recoveryReady = false;
    let adminCheckSequence = 0;

    function showArea(area) {
      loginArea.hidden = area !== "login";
      resetArea.hidden = area !== "reset";
      appArea.hidden = area !== "app";
    }

    function showSession(session) {
      if (recoveryMode) {
        showArea("reset");
      } else {
        showArea(session ? "app" : "login");
        if (session) {
          loadCheckins();
          checkAdminAccess(session);
        } else {
          adminCheckSequence++;
          document.getElementById("admin-panel").hidden = true;
          document.getElementById("membership-request-list").replaceChildren();
          document.getElementById("admin-message").textContent = "";
          document.getElementById("checkin-list").replaceChildren();
          document.getElementById("checkin-message").textContent = "";
        }
      }
    }

    const urlParams = new URLSearchParams(
      window.location.search
    );
    const hashParams = new URLSearchParams(
      window.location.hash.substring(1)
    );

    if (
      hashParams.get("type") === "recovery" ||
      urlParams.get("type") === "recovery" ||
      urlParams.has("token_hash")
    ) {
      recoveryMode = true;
      showArea("reset");
    }

    client.auth.onAuthStateChange(function (event, session) {
      if (event === "PASSWORD_RECOVERY") {
        recoveryMode = true;
        recoveryReady = true;
        showArea("reset");
        resetMessage.textContent = "";
        return;
      }

      if (recoveryMode) {
        showArea("reset");
        return;
      }

      showSession(session);
    });

    async function initialize() {
      const tokenHash = urlParams.get("token_hash");
      const tokenType = urlParams.get("type");

      if (tokenHash && tokenType === "recovery") {
        recoveryMode = true;
        showArea("reset");

        const { error } = await client.auth.verifyOtp({
          token_hash: tokenHash,
          type: "recovery"
        });

        if (error) {
          resetMessage.textContent =
            "再設定リンクが無効か期限切れです。再送信してください。";
          return;
        }

        recoveryReady = true;
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
        return;
      }

      const { data, error } = await client.auth.getSession();

      if (error) {
        if (recoveryMode) {
          resetMessage.textContent =
            "再設定リンクを確認できませんでした。再送信してください。";
        } else {
          showArea("login");
          message.textContent =
            "ログイン状態を確認できませんでした。";
        }
        return;
      }

      if (recoveryMode) {
        if (data.session) {
          recoveryReady = true;
        } else {
          resetMessage.textContent =
            "再設定リンクが無効か期限切れです。再送信してください。";
        }
        showArea("reset");
      } else {
        showSession(data.session);
      }
    }

    document.getElementById("login-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "ログイン確認中...";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          message.textContent =
            "ログインできません。入力内容をご確認ください。";
          return;
        }

        message.textContent = "";
        showSession(data.session);
      });

    document.getElementById("reset-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!recoveryMode || !recoveryReady) {
          resetMessage.textContent =
            "再設定リンクを確認できません。新しいメールを取得してください。";
          return;
        }

        const password =
          document.getElementById("new-password").value;
        const confirm =
          document.getElementById("confirm-password").value;

        if (password.length < 12) {
          resetMessage.textContent =
            "パスワードは12文字以上にしてください。";
          return;
        }

        if (password !== confirm) {
          resetMessage.textContent =
            "確認用パスワードが一致しません。";
          return;
        }

        const button = document.getElementById("reset-button");
        button.disabled = true;
        resetMessage.textContent = "パスワードを設定中...";

        try {
          const { error } = await client.auth.updateUser({
            password: password
          });

          if (error) {
            resetMessage.textContent =
              "設定できませんでした。リンクの期限などをご確認ください。";
            return;
          }

          const { error: signOutError } =
            await client.auth.signOut();

          if (signOutError) {
            resetMessage.textContent =
              "パスワードは設定されましたが、ログアウトに失敗しました。";
            return;
          }

          recoveryMode = false;
          recoveryReady = false;
          document.getElementById("reset-form").reset();
          document.getElementById("login-form").reset();
          showArea("login");
          message.style.color = "#176b37";
          message.textContent =
            "パスワードを設定しました。新しいパスワードでログインしてください。";
        } finally {
          button.disabled = false;
        }
      });

    document.getElementById("logout")
      .addEventListener("click", async function () {
        const { error } = await client.auth.signOut();

        if (error) {
          alert("ログアウトに失敗しました。");
          return;
        }

        showArea("login");
      });

    async function loadCheckins() {
      const list = document.getElementById("checkin-list");
      list.textContent = "読み込み中...";
      const { data: authData, error: authError } = await client.auth.getUser();
      if (authError || !authData.user) {
        list.textContent = "ログイン状態を確認できません。";
        return;
      }
      const { data, error } = await client.from("checkins")
        .select("id,created_at,member_name,resort_name,condition,comment")
        .order("created_at", { ascending: false })
        .limit(30);
      if (error) {
        list.textContent = "一覧を取得できませんでした。設定・通信状態を確認してください。";
        console.error("checkins select error", error);
        return;
      }
      list.replaceChildren();
      if (!data.length) {
        list.textContent = "まだ投稿がありません。";
        return;
      }
      for (const item of data) {
        const entry = document.createElement("div");
        entry.className = "checkin-item";
        const heading = document.createElement("strong");
        const when = item.created_at ? new Date(item.created_at).toLocaleString("ja-JP") : "";
        heading.textContent = `${item.member_name}（${when}）`;
        const detail = document.createElement("p");
        detail.textContent = `📍 ${item.resort_name} ｜ ❄️ ${item.condition}`;
        entry.append(heading, detail);
        if (item.comment) {
          const comment = document.createElement("p");
          comment.textContent = `💬 ${item.comment}`;
          entry.append(comment);
        }
        list.append(entry);
      }
    }

    async function checkAdminAccess(session) {
      const sequence = ++adminCheckSequence;
      const panel = document.getElementById("admin-panel");
      panel.hidden = true;
      if (!session || !session.user) return;
      const { data, error } = await client.from("app_admins")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();
      if (sequence !== adminCheckSequence) return;
      if (error) {
        console.error("admin check failed", error.code);
        return;
      }
      if (!data) return;
      panel.hidden = false;
      loadMembershipRequests();
    }

    async function loadMembershipRequests() {
      const list = document.getElementById("membership-request-list");
      const status = document.getElementById("admin-message");
      if (document.getElementById("admin-panel").hidden) return;
      list.replaceChildren();
      status.textContent = "申請一覧を読み込み中...";
      const { data, error } = await client.from("membership_requests")
        .select("id,member_name,email,status,invitation_status,created_at")
        .order("created_at", { ascending: false })
        .limit(100);
      if (document.getElementById("admin-panel").hidden) return;
      if (error) {
        console.error("membership requests select failed", error.code);
        status.textContent = "申請一覧を取得できません。Supabaseの管理者向けSELECT権限（RLS）を確認してください。";
        return;
      }
      status.textContent = `申請 ${data.length} 件（最大100件）`;
      if (!data.length) {
        list.textContent = "表示できる申請はありません。";
        return;
      }
      for (const item of data) {
        const entry = document.createElement("div");
        entry.className = "admin-item";
        const name = document.createElement("strong");
        name.textContent = item.member_name || "名前未設定";
        const email = document.createElement("p");
        email.textContent = `メール：${item.email || ""}`;
        const date = document.createElement("p");
        date.textContent = `申請日時：${item.created_at ? new Date(item.created_at).toLocaleString("ja-JP") : "不明"}`;
        const state = document.createElement("p");
        state.textContent = `審査：${item.status} ／ 招待：${item.invitation_status || "不明"}`;
        entry.append(name, email, date, state);
        if (item.status === "pending") {
          const actions = document.createElement("div");
          actions.className = "admin-actions";
          for (const action of ["approve", "reject"]) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = action === "approve" ? "承認" : "却下";
            if (action === "reject") button.className = "reject";
            button.addEventListener("click", () => reviewMembershipRequest(item, action));
            actions.append(button);
          }
          entry.append(actions);
        }
        list.append(entry);
      }
    }

    async function reviewMembershipRequest(item, action) {
      const verb = action === "approve" ? "承認" : "却下";
      if (!confirm(`${item.member_name} さんの申請を${verb}しますか？`)) return;
      const status = document.getElementById("admin-message");
      const buttons = document.querySelectorAll(".admin-actions button");
      buttons.forEach(button => { button.disabled = true; });
      status.textContent = `${verb}処理中...`;
      try {
        const { data: authData, error: authError } = await client.auth.getSession();
        if (authError || !authData.session?.access_token) {
          status.textContent = "ログイン状態を確認できません。再ログインしてください。";
          return;
        }
        const response = await fetch(`${SUPABASE_URL}/functions/v1/review-membership-request`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${authData.session.access_token}`
          },
          body: JSON.stringify({ request_id: item.id, action })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          status.textContent = result.error || `処理に失敗しました（HTTP ${response.status}）。`;
          return;
        }
        await loadMembershipRequests();
        status.textContent = result.message || `${verb}しました。`;
      } catch (error) {
        console.error("membership review request failed", error);
        status.textContent = "通信エラーです。処理状況を確認してから再試行してください。";
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    document.getElementById("refresh-requests")
      .addEventListener("click", loadMembershipRequests);

    document.getElementById("refresh-checkins")
      .addEventListener("click", loadCheckins);

    document.getElementById("checkin-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        const status = document.getElementById("checkin-message");
        const button = document.getElementById("checkin-submit");
        const member_name = document.getElementById("member-name").value.trim();
        const resort_name = document.getElementById("resort-name").value;
        const condition = document.getElementById("snow-condition").value;
        const comment = document.getElementById("quick-comment").value;
        if (!member_name || !resort_name) {
          status.textContent = "お名前とゲレンデを入力してください。";
          return;
        }
        button.disabled = true;
        status.textContent = "投稿中...";
        try {
          const { data: authData, error: authError } = await client.auth.getUser();
          if (authError || !authData.user) {
            status.textContent = "ログインし直してください。";
            return;
          }
          const { error } = await client.from("checkins")
            .insert({ member_name, resort_name, condition, comment: comment || null });
          if (error) {
            console.error("checkins insert error", error);
            status.textContent = "投稿に失敗しました。通信・権限設定をご確認ください。";
            return;
          }
          status.textContent = "投稿を保存しました。";
          await loadCheckins();
        } finally {
          button.disabled = false;
        }
      });

    initialize();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./sw.js")
          .then(function (registration) {
            console.log(
              "Service Worker registered:",
              registration.scope
            );
          })
          .catch(function (error) {
            console.error(
              "Service Worker registration failed:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
